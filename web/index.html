<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizzer — live quiz platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> <span class="name">QUIZZER</span></div>
  </div>

  <div class="card center" style="margin-bottom:18px;">
    <h1>Run a live quiz</h1>
    <p class="muted">Buzzer rounds, free-text, and multiple-choice — scored live, from one screen.</p>
  </div>

  <!-- Host auth -->
  <div class="card" id="authCard">
    <div class="seg" id="modeSeg">
      <button class="seg-btn" data-mode="signup">Create account</button>
      <button class="seg-btn" data-mode="login">Sign in</button>
    </div>
    <p class="muted tiny center" id="modeHint" style="margin:0 0 14px;"></p>
    <div class="stack">
      <div>
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div>
        <label>Password <span class="tiny muted" id="pwHint"></span></label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="err" id="authErr"></div>
      <div id="authFix"></div>
      <button class="btn primary block lg" id="authBtn">Create account</button>
    </div>
  </div>

  <!-- Join a game -->
  <div class="card" style="margin-top:16px;">
    <h2>Join a game</h2>
    <p class="muted tiny">Playing in someone's quiz? Enter the room code — no account needed.</p>
    <div class="row">
      <input id="joinCode" placeholder="ROOM CODE" style="text-transform:uppercase; letter-spacing:.15em; font-weight:700;" maxlength="5">
      <button class="btn" id="joinBtn">Join →</button>
    </div>
    <p class="tiny muted" style="margin-top:10px;">Showing the game on a TV? Open the <a href="/display.html">shared display</a>.</p>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
  // already logged in? go to dashboard
  if (Auth.token) location.href = "/host.html";

  // Default to signup: accounts live in this app's own database, so a first-time
  // host has nothing to sign in with. Returning hosts get their email remembered.
  const lastEmail = localStorage.getItem("qz_last_email") || "";
  let mode = lastEmail ? "login" : "signup";
  const $email = $("#email"), $pw = $("#password"), $err = $("#authErr");
  const $btn = $("#authBtn"), $hint = $("#pwHint"), $fix = $("#authFix");
  if (lastEmail) $email.value = lastEmail;

  function setMode(m) { mode = m; render(); }

  function render() {
    $$("#modeSeg .seg-btn").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    if (mode === "login") {
      $btn.textContent = "Sign in";
      $pw.autocomplete = "current-password";
      $hint.textContent = "";
      $("#modeHint").textContent = "Welcome back — sign in to your quizzes.";
    } else {
      $btn.textContent = "Create account";
      $pw.autocomplete = "new-password";
      $hint.textContent = "(6+ characters)";
      $("#modeHint").textContent = "New here? Hosting a quiz needs an account — it takes a second.";
    }
    $err.textContent = "";
    $fix.innerHTML = "";
  }

  $$("#modeSeg .seg-btn").forEach((b) => { b.onclick = () => setMode(b.dataset.mode); });

  // Turn a dead-end error into a one-click recovery, keeping what was typed.
  function offerFix(label, m) {
    $fix.innerHTML = "";
    const b = el("button", { class: "btn block", style: "margin-bottom:4px;" }, label);
    b.onclick = () => { setMode(m); submit(); };
    $fix.append(b);
  }

  async function submit() {
    $err.textContent = "";
    $fix.innerHTML = "";
    const email = $email.value.trim(), password = $pw.value;
    if (!email || !password) { $err.textContent = "Enter your email and password."; return; }
    if (mode === "signup" && password.length < 6) {
      $err.textContent = "Password needs at least 6 characters.";
      return;
    }
    $btn.disabled = true;
    try {
      const path = mode === "login" ? "/api/login" : "/api/signup";
      const data = await api(path, "POST", { email, password });
      Auth.set(data.token, data.email);
      localStorage.setItem("qz_last_email", data.email || email);
      location.href = "/host.html";
    } catch (e) {
      $err.textContent = e.message;
      $btn.disabled = false;
      if (/no account/i.test(e.message)) offerFix("Create an account for " + email + " →", "signup");
      else if (/already exists/i.test(e.message)) offerFix("Sign in as " + email + " instead →", "login");
    }
  }
  $btn.onclick = submit;
  $pw.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  function join() {
    const code = $("#joinCode").value.trim().toUpperCase();
    if (code) location.href = "/play.html?code=" + encodeURIComponent(code);
  }
  $("#joinBtn").onclick = join;
  $("#joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

  render();
</script>
</body>
</html>
